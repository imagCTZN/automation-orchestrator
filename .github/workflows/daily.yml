name: Run Network Check

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout script repository
        uses: actions/checkout@v4
        with:
          repository: imagCTZN/
          path: script-repo                       

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run network check script
        working-directory: script-repo
        run: python network_check.py
